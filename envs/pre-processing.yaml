# Environment for BWA, GATK, samtools, and Python data processing.
# Provides the core tools for read alignment and BAM processing in CNVPipe.

channels:
  - bioconda
  - conda-forge
dependencies:
  # Python
  - python ==3.7.10
  - pandas ==1.3.1
  - numpy ==1.21.2
  # Tools
  - bwa ==0.7.17
  - gatk4 ==4.1.4.1
  - samtools ==1.12
